<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Nuvapix Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css?v=4ec7d8ee" />
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="./" class="logo" aria-label="Nuvapix">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span>Nuvapix</span>
    </a>
    <nav class="toplinks"><a href="./" data-i18n="adm.back">Back to website</a></nav>
    <div class="lang" role="group" data-i18n-aria="lang.label" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ms" aria-pressed="false">BM</button>
    </div>
    <button class="acct-btn" id="logoutBtn" type="button" hidden data-i18n="acct.logout">Log out</button>
  </div>
</header>

<main class="wrap adm-main">
  <section class="adm-gate" id="gate" hidden>
    <h2 data-i18n="adm.gate">Admin login</h2>
    <p class="muted" id="gateSub" data-i18n="adm.gateSub">Log in with the admin account.</p>
    <form id="gateForm" class="auth-form" novalidate>
      <label class="field"><span data-i18n="auth.email">Email</span><input name="email" type="email" autocomplete="username" required /></label>
      <label class="field"><span data-i18n="auth.password">Password</span><input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="auth-err" id="gateErr" role="alert" hidden></p>
      <button class="btn btn-ink" type="submit" data-i18n="auth.login">Log in</button>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="adm-head">
      <h1 data-i18n="adm.title">Admin dashboard</h1>
      <span class="mono small muted" id="who"></span>
    </div>
    <div class="adm-stats" id="stats"></div>
    <div class="adm-tools">
      <input type="search" id="q" data-i18n-ph="adm.search" placeholder="Search name or email" />
      <select id="filter">
        <option value="" data-i18n="adm.fAll">All plans</option>
        <option value="free" data-i18n="adm.stFree">Free</option>
        <option value="basic" data-i18n="adm.stBasic">Basic</option>
        <option value="pro" data-i18n="adm.stPro">Pro</option>
        <option value="expired" data-i18n="adm.fExpired">Expired</option>
        <option value="disabled" data-i18n="adm.fDisabled">Disabled</option>
      </select>
      <button class="btn btn-line" id="refresh" type="button" data-i18n="adm.refresh">Refresh</button>
      <span class="mono small muted" id="count"></span>
    </div>
    <div class="adm-table-wrap">
      <table class="adm-table">
        <thead><tr>
          <th data-i18n="adm.cUser">User</th>
          <th data-i18n="adm.cPlan">Plan</th>
          <th data-i18n="adm.cExpires">Active until</th>
          <th data-i18n="adm.cUsage">Usage</th>
          <th data-i18n="adm.cStatus">Account</th>
          <th data-i18n="adm.cActions">Actions</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="adm-empty" id="empty" hidden data-i18n="adm.empty">No users match.</p>
    </div>
  </section>
</main>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js?v=d2d52063"></script>
<script src="account.js?v=282f0c10"></script>
<script src="i18n.js?v=08838fd3"></script>
<script src="admin.js?v=3c63ad36"></script>
</body>
</html>
